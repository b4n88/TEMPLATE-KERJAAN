<!DOCTYPE html>
<html>

<head>
  <base target="_top">

  <style>

    body{
      margin:0;
      padding:30px;
      background:#f3f4f6;
      font-family:Arial, sans-serif;
      min-height:100vh;
      display:flex;
      flex-direction:column;
    }

    h1{
      text-align:center;
      color:#1f2937;
      margin-bottom:20px;
    }

    /* ============ SEARCH BAR ============ */
    .search-wrapper{
      display:flex;
      justify-content:center;
      margin-bottom:30px;
    }

    #searchInput{
      width:100%;
      max-width:400px;
      padding:12px 18px;
      font-size:16px;
      border:2px solid #d1d5db;
      border-radius:10px;
      outline:none;
      transition:0.3s;
      box-sizing:border-box;
    }

    #searchInput:focus{
      border-color:#3b82f6;
      box-shadow:0 0 0 3px rgba(59,130,246,0.2);
    }

    .container{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
      gap:20px;
      flex:1;
    }

    .card{
      height:120px;
      border-radius:15px;
      color:white;
      font-size:20px;
      font-weight:bold;

      display:flex;
      justify-content:center;
      align-items:center;

      cursor:pointer;

      transition:0.3s;
      box-shadow:0 4px 10px rgba(0,0,0,0.15);
      text-align:center;
      padding:10px;
      box-sizing:border-box;
    }

    .card:hover{
      transform:translateY(-5px);
    }

    /* Muncul kalau hasil pencarian kosong */
    .no-result{
      text-align:center;
      color:#6b7280;
      font-size:16px;
      grid-column:1/-1;
      padding:40px 0;
    }

    /* ============ FOOTER ============ */
    footer{
      text-align:center;
      margin-top:40px;
      padding-top:20px;
      color:#6b7280;
      font-size:14px;
    }

  </style>
</head>

<body>

<h1>📊 PORTAL FINANCE</h1>

<div class="search-wrapper">
  <input type="text" id="searchInput" placeholder="🔍 Cari menu...">
</div>

<div class="container" id="menuContainer"></div>

<footer>
  Created by : Albani
</footer>

<script>

let allMenuData = []; // simpan semua data menu di sini

/**
 * ==========================================
 * AMBIL DATA DARI APPS SCRIPT
 * ==========================================
 */
google.script.run
.withSuccessHandler(function(data){
  allMenuData = data;
  createMenu(allMenuData);
})
.getMenuData();


/**
 * ==========================================
 * MEMBUAT CARD MENU OTOMATIS
 * ==========================================
 */
function createMenu(data){

  let html = '';

  if(data.length === 0){
    html = '<div class="no-result">Menu tidak ditemukan 😕</div>';
  } else {
    data.forEach(menu => {

      html += `
        <div class="card"
             style="background:${menu.warna}"
             onclick="window.open('${menu.link}','_blank')">

             ${menu.nama}

        </div>
      `;

    });
  }

  document.getElementById('menuContainer').innerHTML = html;

}


/**
 * ==========================================
 * FUNGSI PENCARIAN MENU
 * ==========================================
 */
document.getElementById('searchInput').addEventListener('input', function(e){

  const keyword = e.target.value.toLowerCase();

  const filtered = allMenuData.filter(menu =>
    menu.nama.toLowerCase().includes(keyword)
  );

  createMenu(filtered);

});

</script>

</body>

</html>
